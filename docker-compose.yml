version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: melenium_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./landing/dist:/var/www/landing
      - ./panel/public:/var/www/panel/public
      - ./panel:/var/www/panel
    depends_on:
      - php-fpm
      - node
    networks:
      - melenium_network

  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: melenium_php
    volumes:
      - ./panel:/var/www/panel
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=melenium_panel
      - DB_USERNAME=melenium_user
      - DB_PASSWORD=melenium_password
      - REDIS_HOST=redis
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:SomeRandomGeneratedKeyHere==
    depends_on:
      - mysql
      - redis
    networks:
      - melenium_network

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: melenium_node
    volumes:
      - ./landing:/app/landing
      - ./panel:/app/panel
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - NODE_ENV=production
    networks:
      - melenium_network

  mysql:
    image: mysql:8.0
    container_name: melenium_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: melenium_panel
      MYSQL_USER: melenium_user
      MYSQL_PASSWORD: melenium_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - melenium_network

  redis:
    image: redis:alpine
    container_name: melenium_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - melenium_network

volumes:
  mysql_data:
  redis_data:

networks:
  melenium_network:
    driver: bridge